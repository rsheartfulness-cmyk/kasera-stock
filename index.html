<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kasera Stock</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#1a2236; --muted:#5a6480;
  --line:#e6e9f0; --line2:#eef1f7;
  --accent:#2563eb; --accent-dark:#1d4ed8; --accent-soft:#e8eefb;
  --good:#16a34a; --good-soft:#e7f7ec;
  --bad:#e11d48; --bad-soft:#fdeaee;
  --warn:#ea9a0c; --warn-soft:#fdf4e3;
  --slate:#1a2236;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,55,.06),0 6px 24px rgba(20,30,55,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.45;
}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif;}
button{font-family:inherit}
.hidden{display:none !important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 120% at 0% 0%, #fff7ec 0%, var(--bg) 45%);}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:30px 26px;width:100%;max-width:380px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo .mark{width:44px;height:44px;border-radius:11px;background:var(--slate);
  display:grid;place-items:center;color:#fff;font-weight:800;font-family:'Bricolage Grotesque';
  font-size:20px;box-shadow:inset 0 0 0 3px var(--accent)}
.logo .name{font-size:21px;font-weight:800;letter-spacing:-.3px}
.logo .sub{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1.5px}
.login-card h2{margin:20px 0 4px;font-size:19px}
.login-card p.hint{margin:0 0 18px;color:var(--muted);font-size:13px}

/* ---------- Shell: left sidebar ---------- */
#app{min-height:100vh;display:flex;flex-direction:row}
#side{width:236px;flex-shrink:0;background:#fff;color:var(--ink);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;z-index:40;border-right:1px solid var(--line)}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.side-brand .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#3b82f6);color:#fff;
  display:grid;place-items:center;font-weight:800;font-family:'Bricolage Grotesque';font-size:16px;box-shadow:0 2px 10px rgba(37,99,235,.3)}
.side-brand .bn{font-weight:800;font-size:16px;letter-spacing:-.2px;line-height:1.1}
.side-brand .bs{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin-top:2px}
#navList{flex:1;overflow-y:auto;padding:8px}
#navList button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--muted);
  padding:11px 13px;border-radius:10px;font-weight:600;font-size:14.5px;cursor:pointer;text-align:left;margin-bottom:2px}
#navList button .ic{width:20px;text-align:center;font-size:15px}
#navList button:hover{background:var(--bg);color:var(--ink)}
#navList button.active{background:var(--accent-soft);color:var(--accent-dark);box-shadow:inset 0 0 0 1px rgba(37,99,235,.12)}
.side-foot{padding:12px;border-top:1px solid var(--line)}
.side-foot .nm{font-weight:700;font-size:13.5px}
.side-foot .rl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:1px 0 9px}
.side-foot .out{width:100%;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:10px;font-weight:600;cursor:pointer;font-size:13px}
.side-foot .out:hover{background:#eef1f7;color:var(--ink)}
#sideScrim{display:none;position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:38}
#sideScrim.show{display:block}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.mtop{display:none;align-items:center;gap:12px;padding:10px 14px;background:#fff;color:var(--ink);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line)}
.mtop .menu{background:var(--accent-soft);border:0;color:var(--accent-dark);width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.mtop .mtitle{font-weight:800;font-size:16px}
main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:20px 18px 90px}
@media (max-width:900px){
  #side{position:fixed;left:-260px;top:0;transition:left .22s ease}
  #side.open{left:0;box-shadow:8px 0 40px rgba(0,0,0,.4)}
  .mtop{display:flex}
  main{padding:16px 14px 90px}
}
/* product detail + chips */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.detail-grid .dk{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.detail-grid .dv{font-weight:600;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--line2);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.chip .rm{cursor:pointer;color:var(--bad);font-weight:800}
.subsec{font-weight:700;margin:16px 0 8px;font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.5px}
.addline{display:flex;gap:8px;margin-top:8px}
.addline input{flex:1}
.detail-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2)}
.detail-tabs button{background:none;border:0;padding:10px 12px;font-weight:700;color:var(--muted);cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.detail-tabs button.active{color:var(--accent-dark);border-bottom-color:var(--accent)}
/* nav svg icons */
#navList button .ic{display:inline-flex;align-items:center;justify-content:center}
#navList button .ic svg{width:18px;height:18px}
/* page guidance */
.viewhead .sub{flex-basis:100%;color:var(--muted);font-size:13.5px;margin-top:-8px}
.guide{background:var(--accent-soft);border:1px solid #cdd9f6;color:#1e3a8a;border-radius:12px;
  padding:11px 14px;font-size:13.5px;margin-bottom:16px;line-height:1.5}
.guide b{color:#5e3804}
label.fl .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:15px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:.12s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .ti{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;flex-shrink:0}
.tile .ti svg{width:20px;height:20px}
.tile .tl{font-weight:700;font-size:14.5px}
.tile .td{font-size:12px;color:var(--muted);margin-top:1px}
/* workflow stepper */
.stepper{position:relative;margin:6px 0 4px}
.step{display:flex;gap:13px;position:relative;padding-bottom:16px}
.step:not(:last-child)::before{content:'';position:absolute;left:12px;top:27px;bottom:-1px;width:2px;background:var(--line)}
.step .dot{width:25px;height:25px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--line2);color:var(--muted);z-index:1}
.step.done .dot{background:var(--good);color:#fff}
.step.current .dot{background:var(--accent);color:#fff}
.step .stt{font-weight:700;font-size:14px}
.step.pending .stt{color:var(--muted)}
.step .smeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.step .act{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
/* BOM rows */
.bomrow{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.bomrow select{flex:1}
.bomrow input{width:84px;flex:0 0 auto}
.bomrow .x{background:var(--line2);border:0;width:34px;height:38px;border-radius:9px;cursor:pointer;color:var(--bad);font-weight:800;flex:0 0 auto}
.pill.issued{background:#e8eefb;color:#2b51b5}
.pill.completed{background:var(--good-soft);color:var(--good)}
.pill.short{background:var(--bad-soft);color:var(--bad)}
.pill.approved2{background:var(--good-soft);color:var(--good)}
.viewhead{display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.viewhead h2{margin:0;font-size:22px;letter-spacing:-.4px}
.viewhead .spacer{flex:1}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;cursor:pointer;
  font-weight:700;font-size:14px;padding:11px 16px;transition:.12s;line-height:1}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark)}
.btn.dark{background:var(--slate);color:#fff}
.btn.dark:hover{filter:brightness(1.1)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--line2)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:#fff;color:var(--bad);box-shadow:inset 0 0 0 1px #f1c2c2}
.btn.bad:hover{background:var(--bad-soft)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;justify-content:center;padding:13px}

/* ---------- Cards / tables ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:14px}
.card .ch{padding:14px 16px;border-bottom:1px solid var(--line2);font-weight:700;display:flex;align-items:center;gap:10px}
.card .cb{padding:6px 0}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:600}
.row .t2{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:6px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:27px;font-weight:800;font-family:'Bricolage Grotesque';margin-top:3px;letter-spacing:-.5px}
.stat.alert .v{color:var(--accent-dark)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;
  position:sticky;top:0;background:var(--panel)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#fafbfc}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:4px 9px;border-radius:99px;letter-spacing:.2px}
.pill.in{background:var(--good-soft);color:var(--good)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.pill.transfer{background:#e8eefb;color:#2b51b5}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.approved{background:var(--good-soft);color:var(--good)}
.pill.rejected{background:var(--bad-soft);color:var(--bad)}
.pill.low{background:var(--accent-soft);color:var(--accent-dark)}
.pill.role{background:#eef0f4;color:var(--slate)}
.pill.mfg{background:#e8eefb;color:#2b51b5}
.pill.trade{background:var(--good-soft);color:var(--good)}

/* ---------- Forms / modal ---------- */
label.fl{display:block;font-size:13px;font-weight:600;margin:13px 0 5px;color:var(--slate)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:64px;resize:vertical}
.field-err{color:var(--bad);font-size:12.5px;margin-top:8px;min-height:1em}

.backdrop{position:fixed;inset:0;background:rgba(20,28,46,.45);z-index:50;display:flex;
  align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--panel);width:100%;max-width:460px;border-radius:18px 18px 0 0;
  max-height:92vh;overflow:auto;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
.modal .mh{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#fff;z-index:2}
.modal .mh h3{margin:0;font-size:18px;flex:1}
.modal .mh .x{background:var(--line2);border:0;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:18px;color:var(--muted)}
.modal .mb{padding:6px 18px 18px}
.modal .mf{padding:14px 18px 20px;display:flex;gap:10px}
.modal .mf .btn{flex:1;justify-content:center}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:80;
  background:var(--slate);color:#fff;padding:12px 18px;border-radius:11px;font-weight:600;font-size:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad)}
#toast.good{background:var(--good)}

.loader{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fullload{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
.fullload .loader{border-color:var(--line);border-top-color:var(--accent);width:34px;height:34px}

@media (min-width:640px){
  .backdrop{align-items:center;padding:20px}
  .modal{border-radius:18px}
}

/* ============ v2 polish: richer, more "stock software" feel ============ */
main{max-width:1120px}
/* page title with accent bar */
.viewhead h2{position:relative;padding-left:14px}
.viewhead h2::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:5px;border-radius:3px;
  background:linear-gradient(var(--accent),var(--accent-dark))}
/* stat cards: accent stripe + icon, bigger number */
.stat{position:relative;overflow:hidden;padding-left:18px;transition:.12s}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.stat.alert::before{background:var(--accent)}
.stat .si{position:absolute;right:13px;top:13px;width:34px;height:34px;border-radius:9px;
  background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center}
.stat .si svg{width:18px;height:18px}
.stat .v{font-size:30px}
.stat .cap{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.stat:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(20,30,55,.08),0 12px 30px rgba(20,30,55,.10)}
/* tables: zebra + clearer hover, real-software look */
tbody tr:nth-child(even) td{background:#fafbfd}
tbody tr:hover td{background:var(--accent-soft) !important}
th{background:#f7f8fa}
/* card header: small accent dot */
.card .ch::before{content:'';width:8px;height:8px;border-radius:3px;flex:0 0 auto;
  background:linear-gradient(var(--accent),var(--accent-dark));display:inline-block}
/* tiles: subtle top accent on hover */
.tile{position:relative}
.tile::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;border-radius:var(--radius) var(--radius) 0 0;
  background:var(--accent);opacity:0;transition:.12s}
.tile:hover::after{opacity:1}
/* form sections + 2-column compact grid to shorten long forms */
.fsec{font-weight:800;font-size:11px;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.8px;
  margin:18px 0 2px;padding-top:14px;border-top:1px solid var(--line2)}
.fsec:first-child{border-top:0;padding-top:0;margin-top:6px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fg2 > label.fl{margin-top:11px}
@media (max-width:520px){ .fg2{grid-template-columns:1fr} }
/* segmented filter */
.seg{display:inline-flex;background:#eef0f4;border-radius:11px;padding:4px;gap:3px;margin-bottom:14px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13.5px;
  color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,55,.12)}
.seg button:hover:not(.on){color:var(--ink)}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login">
  <div class="login-card">
    <div class="logo">
      <div class="mark">KS</div>
      <div><div class="name">Kasera Stock</div><div class="sub">Inventory &amp; Warehouse</div></div>
    </div>
    <h2>Sign in</h2>
    <p class="hint">Use your Kasera email and password.</p>
    <label class="fl" for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@kaseraindustries.in" />
    <label class="fl" for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" />
    <div class="field-err" id="loginErr"></div>
    <button class="btn primary block" id="loginBtn" style="margin-top:6px">Sign in</button>
  </div>
</section>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="side-brand">
      <div class="mark">KS</div>
      <div><div class="bn">Kasera Stock</div><div class="bs">Inventory &amp; Warehouse</div></div>
    </div>
    <nav id="navList"></nav>
    <div class="side-foot">
      <div class="nm" id="whoName">—</div>
      <div class="rl" id="whoRole">—</div>
      <button class="out" id="logoutBtn">Sign out</button>
    </div>
  </aside>
  <div id="sideScrim"></div>
  <div class="content">
    <header class="mtop">
      <button id="menuBtn" class="menu">☰</button>
      <div class="mtitle">Kasera Stock</div>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* ===================================================================== */
/*  1)  CONFIG  -  EDIT THESE TWO BLOCKS ONLY                            */
/* ===================================================================== */

/*  A) Firebase keys.
    Copy the SAME firebaseConfig object that is already inside your
    task app's index.html (rsheartfulness-cmyk/kasera-delegation).
    Paste it between the braces below, replacing the placeholders.      */
const firebaseConfig = {
  apiKey: "AIzaSyA1dc3sNuyJo9BK5JguaevvY5nSQdsSvZk",
  authDomain: "kasera-delegation.firebaseapp.com",
  projectId: "kasera-delegation",
  storageBucket: "kasera-delegation.firebasestorage.app",
  messagingSenderId: "117646348596",
  appId: "1:117646348596:web:07a7eaf7e1cdb32a0e5561"
};

/*  B) First super admin(s). Any email in this list becomes super admin
    automatically on first sign-in. Add or change people later in the
    People tab.                                                         */
const SUPERADMIN_EMAILS = ["ravi@kaseraindustries.in", "rsheartfulness@gmail.com"];

/*  C) WhatsApp (optional, Phase 1 leaves it OFF).
    When we wire 11za, set ENABLED to true and put your sending URL.
    Until then the app works fully and just skips WhatsApp.             */
const WHATSAPP = {
  ENABLED: false,
  ENDPOINT: "",            // your 11za / Apps Script send URL
};

/* ===================================================================== */
/*  2)  INIT                                                             */
/* ===================================================================== */
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;

// Collections (prefixed so they never clash with your task app's data)

function itemName(id){ const i=S.items.find(x=>x.id===id); return i?i.name:'(deleted item)'; }
function itemUnit(id){ const i=S.items.find(x=>x.id===id); return i?i.unit:''; }
function whName(id){ const w=S.warehouses.find(x=>x.id===id); return w?w.name:'(deleted)'; }
function machineName(id){ const m=S.machines.find(x=>x.id===id); return m?m.name:'(deleted machine)'; }
const uid=()=>'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
// Areas: every warehouse has at least a default "Main" area (id 'main').
function whAreas(whId){ const w=S.warehouses.find(x=>x.id===whId);
  const a=(w&&Array.isArray(w.areas)&&w.areas.length)?w.areas:[{id:'main',name:'Main',managerEmail:''}];
  return a.some(x=>x.id==='main')?a:[{id:'main',name:'Main',managerEmail:''},...a]; }
function areaName(whId,areaId){ const a=whAreas(whId).find(x=>x.id===(areaId||'main')); return a?a.name:(areaId||'Main'); }
function areaManager(whId,areaId){ const a=whAreas(whId).find(x=>x.id===(areaId||'main')); return a?a.managerEmail:''; }
const stockKey=(itemId,whId,areaId)=>itemId+'__'+whId+'__'+(areaId||'main');
const legacyKey=(itemId,whId)=>itemId+'__'+whId;
// quantity of one item in one area (legacy warehouse-level stock counts under 'main')
function areaQty(itemId,whId,areaId){
  const a=S.stock[stockKey(itemId,whId,areaId)]; let q=a?Number(a.quantity)||0:0;
  if((areaId||'main')==='main'){ const lg=S.stock[legacyKey(itemId,whId)]; if(lg) q+=Number(lg.quantity)||0; }
  return q;
}
// total of one item across a whole warehouse (all its areas + any legacy doc)
function stockQty(itemId,whId){ let t=0; const pfx=itemId+'__'+whId+'__'; const lk=legacyKey(itemId,whId);
  for(const k in S.stock){ if(k===lk||k.startsWith(pfx)) t+=Number(S.stock[k].quantity)||0; } return t; }
function itemTotal(itemId){ return S.warehouses.reduce((a,w)=>a+stockQty(itemId,w.id),0); }

// non-blocking WhatsApp send
// Sends a WhatsApp via your existing Apps Script (same backend as the Task app),
// which forwards to 11za using an approved template. Fire-and-forget (no-cors), like the Task app.
async function sendWhatsApp(number, message){
  const url = S.config&&S.config.whatsappUrl;
  const on  = S.config&&S.config.whatsappEnabled;
  const template = (S.config&&S.config.whatsappTemplate)||'';
  if(!on || !url || !number || !template) return;
  const dg=String(number).replace(/\D/g,''); const to=dg.length===10?'91'+dg:dg;
  try{
    fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'waOnly', template, to, params:[message]})}).catch(()=>{});
  }catch(e){ console.warn('whatsapp send failed',e); }
}

$('#loginBtn').addEventListener('click', doLogin);

async function doLogin(){
  const email=$('#email').value.trim(), pass=$('#pass').value;
  $('#loginErr').textContent='';
  if(!email||!pass){ $('#loginErr').textContent='Enter email and password.'; return; }
  if(String(firebaseConfig.apiKey).indexOf('PASTE_FROM')===0){
    $('#loginErr').textContent='Firebase keys not added yet — paste your firebaseConfig from the task app into the top of this file.'; return; }
  const b=$('#loginBtn'); b.disabled=true; b.innerHTML='<span class="loader"></span>';
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ $('#loginErr').textContent = friendlyAuthErr(e); }
  finally{ b.disabled=false; b.textContent='Sign in'; }
}
function friendlyAuthErr(e){
  const m=(e&&e.code)||(e&&e.message)||'';
  if(m.includes('api-key')||m.includes('invalid-api-key')) return 'Firebase keys look wrong — re-check the firebaseConfig pasted at the top of the file.';
  if(m.includes('wrong-password')||m.includes('invalid-credential')) return 'Wrong email or password.';
  if(m.includes('user-not-found')) return 'No account with that email. Ask an admin to create your login.';
  if(m.includes('too-many-requests')) return 'Too many tries. Wait a minute and try again.';
  if(m.includes('invalid-email')) return 'That email does not look right.';
  if(m.includes('network')) return 'Network problem — open the live Netlify site, not a downloaded file, and check internet.';
  return 'Could not sign in. ('+(e.code||e.message||'unknown error')+')';
}

auth.onAuthStateChanged(async user=>{
  detachListeners();
  if(!user){ S.me=null; $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); return; }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#view').innerHTML='<div class="fullload"><span class="loader"></span></div>';
  try{
    S.me = await resolvePerson(user);
  }catch(e){ console.error(e); }
  if(!S.me){ renderNoAccess(user); return; }
  $('#whoName').textContent=S.me.name||S.me.email;
  $('#whoRole').textContent=ROLE_LABEL[S.me.role]||S.me.role;
  attachListeners();
  buildTabs(); go(S.tab);
});

async function resolvePerson(user){
  const email=(user.email||'').toLowerCase();
  const q=await db.collection(C.people).where('email','==',email).limit(1).get();
  if(!q.empty){ const d=q.docs[0]; const p=d.data(); if(p.active===false) return null; return {id:d.id,...p,email}; }
  // bootstrap first super admin
  if(SUPERADMIN_EMAILS.some(e=>e.toLowerCase().trim()===email)){
    const ref=await db.collection(C.people).add({ email, name:(user.displayName||email.split('@')[0]),
      role:'superadmin', whatsapp:'', active:true, createdAt:FieldValue.serverTimestamp() });
    const d=await ref.get(); return {id:ref.id,...d.data(),email};
  }
  return null;
}

function renderNoAccess(user){
  buildTabsEmpty();
  $('#whoName').textContent=user.email; $('#whoRole').textContent='No access';
  $('#view').innerHTML=`<div class="card"><div class="empty">
    <div class="big">🔒</div>
    <div class="t1" style="font-weight:700;margin-bottom:6px">No access yet</div>
    <div>Your login works, but no role has been set for <b>${esc(user.email)}</b>.<br>
    Ask a super admin to add you in the <b>People</b> tab.</div></div></div>`;
}

function attachListeners(){
  S.listeners.push(db.collection(C.people).orderBy('name').onSnapshot(s=>{
    S.people=s.docs.map(d=>({id:d.id,...d.data()})); refreshIfOn(['people']); }));
  S.listeners.push(db.collection(C.items).orderBy('name').onSnapshot(s=>{
    S.items=s.docs.map(d=>({id:d.id,...d.data()})); refreshIfOn(['dashboard','stock','items','requests','move']); }));
  S.listeners.push(db.collection(C.warehouses).orderBy('name').onSnapshot(s=>{
    S.warehouses=s.docs.map(d=>({id:d.id,...d.data()})); refreshIfOn(['dashboard','stock','warehouses','requests','move']); }));
  S.listeners.push(db.collection(C.stock).onSnapshot(s=>{
    S.stock={}; s.docs.forEach(d=>S.stock[d.id]=d.data()); refreshIfOn(['dashboard','stock']); }));
  S.listeners.push(db.collection(C.requests).orderBy('createdAt','desc').limit(200).onSnapshot(s=>{
    S.requests=s.docs.map(d=>({id:d.id,...d.data()})); refreshIfOn(['dashboard','requests']); }));
  S.listeners.push(db.collection(C.movements).orderBy('createdAt','desc').limit(200).onSnapshot(s=>{
    S.movements=s.docs.map(d=>({id:d.id,...d.data()})); refreshIfOn(['logs']); }));
  S.listeners.push(db.collection(C.logs).orderBy('createdAt','desc').limit(200).onSnapshot(s=>{
    S.logs=s.docs.map(d=>({id:d.id,...d.data()})); refreshIfOn(['logs']); }));
  S.listeners.push(db.collection(C.machines).orderBy('name').onSnapshot(s=>{
    S.machines=s.docs.map(d=>({id:d.id,...d.data()})); refreshIfOn(['machines','builds']); }));
  S.listeners.push(db.collection(C.builds).orderBy('createdAt','desc').limit(200).onSnapshot(s=>{
    S.builds=s.docs.map(d=>({id:d.id,...d.data()})); refreshIfOn(['dashboard','builds']); }));
  S.listeners.push(db.collection(C.customers).orderBy('name').onSnapshot(s=>{
    S.customers=s.docs.map(d=>({id:d.id,...d.data()})); refreshIfOn(['customers','allocations','allocate']); }));
  S.listeners.push(db.collection(C.allocations).orderBy('createdAt','desc').limit(200).onSnapshot(s=>{
    S.allocations=s.docs.map(d=>({id:d.id,...d.data()})); refreshIfOn(['dashboard','allocations','customers','stock']); }));
  S.listeners.push(db.collection(C.config).doc('settings').onSnapshot(d=>{
    S.config=d.exists?d.data():{};
    if(S.me){ buildTabs(); if(!navAllowed(S.tab)) go('dashboard'); }
    refreshIfOn(['settings']); }));
}
function detachListeners(){ S.listeners.forEach(u=>{try{u()}catch(e){}}); S.listeners=[]; }
function refreshIfOn(tabs){ if(tabs.includes(S.tab)) go(S.tab,true); }

];
function navAllowed(key){
  if(!S.me) return true;
  if(S.me.role==='superadmin') return true;        // super admin always sees everything
  if(key==='dashboard') return true;               // never hide the home screen
  const acc = S.config && S.config.access && S.config.access[S.me.role];
  if(!acc) return true;                            // no rule set → visible by default
  return acc[key]!==false;
}
function buildTabs(){
  const n=$('#navList'); n.innerHTML='';
  TABS.filter(t=>t.show() && navAllowed(t.k)).forEach(t=>{
    const b=el(`<button data-k="${t.k}"><span class="ic">${svgIcon(t.ic)}</span>${t.label}</button>`);
    b.onclick=()=>go(t.k); n.appendChild(b);
  });
}
function buildTabsEmpty(){ $('#navList').innerHTML=''; }
function openSide(o){ $('#side').classList.toggle('open',o); $('#sideScrim').classList.toggle('show',o); }
$('#menuBtn').addEventListener('click',()=>openSide(true));
$('#sideScrim').addEventListener('click',()=>openSide(false));
function go(tab,keepScroll){
  if(!navAllowed(tab)) tab='dashboard';
  S.tab=tab;
  document.querySelectorAll('#navList button').forEach(b=>b.classList.toggle('active',b.dataset.k===tab));
  openSide(false);
  const v=$('#view'); const y=keepScroll?window.scrollY:0;
  ({dashboard:viewDashboard,stock:viewStock,requests:viewRequests,items:viewItems,
    machines:viewMachines,builds:viewBuilds,customers:viewCustomers,allocations:viewAllocations,
    warehouses:viewWarehouses,people:viewPeople,logs:viewLogs,settings:viewSettings}[tab]||viewDashboard)(v);
  if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
}

// ---------- Dashboard ----------
function viewDashboard(v){
  const totalItems=S.items.length, totalWh=S.warehouses.length;
  const totalUnits=S.items.reduce((a,i)=>a+itemTotal(i.id),0);
  const mfgCount=S.items.filter(i=>i.nature==='manufacturing').length;
  const tradeCount=S.items.filter(i=>i.nature==='trading').length;
  const stockValue=S.items.reduce((a,i)=>a + itemTotal(i.id)*(Number(i.purchasePrice)||0), 0);
  const pending=S.requests.filter(r=>r.status==='pending').length;
  const low=S.items.filter(i=> i.lowStock>0 && itemTotal(i.id)<=Number(i.lowStock));

  const activeBuilds=S.builds.filter(b=>b.status && !['completed','rejected'].includes(b.status));
  v.innerHTML='';
  v.appendChild(el(`<div class="viewhead"><h2>Dashboard</h2>
    <div class="sub">A quick overview of stock, machine builds and what needs attention.</div></div>`));

  const tiles=el('<div class="tiles"></div>');
  const addTile=(icon,title,desc,fn)=>{ const t=el(`<div class="tile"><div class="ti">${svgIcon(icon)}</div><div><div class="tl">${esc(title)}</div><div class="td">${esc(desc)}</div></div></div>`); t.onclick=fn; tiles.appendChild(t); };
  addTile('builds','New build','Request a machine to be built',()=>openBuildModal());
  if(can.directMove()) addTile('stock','Stock movement','Receive, issue or transfer',()=>openMoveModal());
  addTile('requests','New request','Ask for material in or out',()=>openRequestModal());
  if(can.allocate()) addTile('allocations','Allocate / Deliver','Give products to a customer or person',()=>openAllocationModal());
  v.appendChild(tiles);

  const grid=el(`<div class="stat-grid">
    <div class="stat ${activeBuilds.length?'alert':''}"><div class="si">${svgIcon('builds')}</div><div class="k">Builds in progress</div><div class="v">${fmtNum(activeBuilds.length)}</div></div>
    <div class="stat"><div class="si">${svgIcon('products')}</div><div class="k">Products</div><div class="v">${fmtNum(totalItems)}</div><div class="cap">${fmtNum(mfgCount)} made · ${fmtNum(tradeCount)} trading</div></div>
    <div class="stat"><div class="si">${svgIcon('stock')}</div><div class="k">Stock value</div><div class="v">₹${fmtNum(Math.round(stockValue))}</div><div class="cap">at purchase price</div></div>
    <div class="stat"><div class="si">${svgIcon('warehouses')}</div><div class="k">Warehouses</div><div class="v">${fmtNum(totalWh)}</div></div>
    <div class="stat ${low.length?'alert':''}"><div class="si">${svgIcon('alert')}</div><div class="k">Low stock</div><div class="v">${fmtNum(low.length)}</div></div>
  </div>`);
  v.appendChild(grid);

  const bc=el(`<div class="card"><div class="ch">Machine builds in progress ${activeBuilds.length?`<span class="pill pending">${activeBuilds.length}</span>`:''}</div><div class="cb" id="bcBody"></div></div>`);
  v.appendChild(bc);
  const bcb=bc.querySelector('#bcBody');
  if(!activeBuilds.length) bcb.innerHTML='<div class="empty">No builds in progress. Tap “New build” above to start one.</div>';
  else activeBuilds.slice(0,6).forEach(b=>bcb.appendChild(buildRow(b)));

  const toDeliver=S.allocations.filter(a=>a.status==='reserved');
  if(toDeliver.length){
    const dc=el(`<div class="card"><div class="ch">Reserved — waiting to deliver <span class="pill pending">${toDeliver.length}</span></div><div class="cb" id="tdBody"></div></div>`);
    v.appendChild(dc); const tb=dc.querySelector('#tdBody');
    toDeliver.slice(0,6).forEach(a=>tb.appendChild(allocRow(a)));
  }

  const lowCard=el(`<div class="card"><div class="ch">Low stock ${low.length?`<span class="pill low">${low.length}</span>`:''}</div><div class="cb" id="lowBody"></div></div>`);
  v.appendChild(lowCard);

// ---------- Stock ----------
function viewStock(v){
  v.innerHTML='';
  v.appendChild(el(`<div class="viewhead"><h2>Stock</h2><div class="spacer"></div>
    ${can.directMove()?'<button class="btn primary" id="mvBtn">+ Stock movement</button>':''}
    <button class="btn ghost" id="reqBtn">Request</button></div>`));
  v.appendChild(el(`<div class="guide">How much of each product you have. Switch between <b>By warehouse</b> (totals) and <b>By area</b> (exact count in each rack/room). Use <b>+ Stock movement</b> to receive, issue or transfer between areas. Stock can never go below zero.</div>`));

  if(!S.items.length || !S.warehouses.length){
    v.appendChild(el(`<div class="card"><div class="empty"><div class="big">📦</div>
      <div>Add at least one item and one warehouse to see stock.</div></div></div>`));
  }else{
    const hasAreas=S.warehouses.some(w=>whAreas(w.id).length>1);
    const seg=el(`<div class="seg" id="stkSeg"><button class="on" data-v="wh">By warehouse</button><button data-v="area">By area</button></div>`);
    if(hasAreas) v.appendChild(seg);
    const search=el(`<input id="stkSearch" placeholder="Search item…" style="margin-bottom:12px;max-width:340px;display:block">`);
    v.appendChild(search);
    const card=el(`<div class="card"><div class="tablewrap"><table id="stkTable"></table></div></div>`);
    v.appendChild(card);
    let mode='wh';
    const draw=()=>renderStockTable(card.querySelector('table'),search.value.toLowerCase(),mode==='area');
    draw();
    search.addEventListener('input',draw);
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ mode=b.dataset.v; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); draw(); });
  }
  v.querySelector('#mvBtn')?.addEventListener('click',()=>openMoveModal());
  v.querySelector('#reqBtn')?.addEventListener('click',()=>openRequestModal());
}
function renderStockTable(table,filter,byArea){
  const items=S.items.filter(i=>i.name.toLowerCase().includes(filter));
  let cols=[];
  if(byArea){ S.warehouses.forEach(w=>whAreas(w.id).forEach(a=>cols.push({wh:w,area:a}))); }
  else { S.warehouses.forEach(w=>cols.push({wh:w})); }
  let h='<thead><tr><th>Item</th>';
  cols.forEach(c=>h+=`<th class="num">${esc(c.wh.name)}${c.area?'<br><span style="font-weight:600;text-transform:none;color:var(--muted)">'+esc(c.area.name)+'</span>':''}</th>`);
  h+='<th class="num">Total</th></tr></thead><tbody>';
  if(!items.length) h+=`<tr><td colspan="${cols.length+2}"><div class="empty">No items match.</div></td></tr>`;
  items.forEach(i=>{
    const tot=itemTotal(i.id);
    const lowFlag=i.lowStock>0 && tot<=Number(i.lowStock);
    h+=`<tr><td><b>${esc(i.name)}</b> <span class="muted">${esc(i.unit||'')}</span>${lowFlag?' <span class="pill low">low</span>':''}</td>`;
    cols.forEach(c=>{ const q=c.area?areaQty(i.id,c.wh.id,c.area.id):stockQty(i.id,c.wh.id); h+=`<td class="num">${q?fmtNum(q):'<span class="muted">0</span>'}</td>`; });
    h+=`<td class="num"><b>${fmtNum(tot)}</b></td></tr>`;
  });
  h+='</tbody>';
  table.innerHTML=h;
}

// ---------- Requests ----------
function viewRequests(v){
  v.innerHTML='';
  v.appendChild(el(`<div class="viewhead"><h2>Requests</h2><div class="spacer"></div>
    <button class="btn primary" id="newReq">+ New request</button></div>`));
  v.appendChild(el(`<div class="guide">Anyone can <b>request</b> material in or out. A supervisor or admin then approves or rejects it — approving moves the stock automatically.</div>`));

  const pending=S.requests.filter(r=>r.status==='pending');
  const others=S.requests.filter(r=>r.status!=='pending').slice(0,80);

  const p=el(`<div class="card"><div class="ch">Pending ${pending.length?`<span class="pill pending">${pending.length}</span>`:''}</div><div class="cb" id="pb"></div></div>`);
  v.appendChild(p);
  const pb=p.querySelector('#pb');
  if(!pending.length) pb.innerHTML='<div class="empty">No pending requests.</div>';
  else pending.forEach(r=>pb.appendChild(reqRow(r,false)));

  const o=el(`<div class="card"><div class="ch">History</div><div class="cb" id="ob"></div></div>`);
  v.appendChild(o);
  const ob=o.querySelector('#ob');
  if(!others.length) ob.innerHTML='<div class="empty">Nothing yet.</div>';
  else others.forEach(r=>ob.appendChild(reqRow(r,true)));

  v.querySelector('#newReq').addEventListener('click',()=>openRequestModal());
}
function reqRow(r,readonly){
  const dirPill=`<span class="pill ${r.type}">${r.type==='in'?'IN':'OUT'}</span>`;
  const stPill=`<span class="pill ${r.status}">${r.status}</span>`;
  const row=el(`<div class="row">
    <div class="grow">
      <div class="t1">${dirPill} ${fmtNum(r.quantity)} ${esc(itemUnit(r.itemId))} · ${esc(itemName(r.itemId))}</div>
      <div class="t2">${esc(whName(r.warehouseId))} · by ${esc(r.requestedByName||'?')} · ${fmtDate(r.createdAt)}${r.note?' · '+esc(r.note):''}</div>
      ${r.status!=='pending'?`<div class="t2">${stPill} ${r.decidedByName?'by '+esc(r.decidedByName):''}${r.decisionNote?' · '+esc(r.decisionNote):''}</div>`:''}
    </div>
    <div class="acts"></div>
  </div>`);
  const acts=row.querySelector('.acts');
  if(!readonly && r.status==='pending' && can.approve()){
    const ap=el('<button class="btn good sm">Approve</button>');
    const rj=el('<button class="btn bad sm" style="margin-left:6px">Reject</button>');
    ap.onclick=()=>decideRequest(r,true); rj.onclick=()=>decideRequest(r,false);
    acts.append(ap,rj);
  } else if(r.status==='pending'){ acts.innerHTML=`<span class="pill pending">pending</span>`; }
  return row;
}

// ---------- Products ----------
function viewItems(v){
  v.innerHTML='';
  v.appendChild(el(`<div class="viewhead"><h2>Products</h2><div class="spacer"></div>
    <input id="prodSearch" placeholder="Search…" style="max-width:220px">
    <button class="btn primary" id="addItem">+ Add product</button></div>`));
  v.appendChild(el(`<div class="guide">Your master list of items. <b>Manufacturing</b> = something you make in-house; <b>Trading</b> = something you buy and resell. Tap a product to see its stock and movement history. Set a <b>low-stock level</b> so it warns you before you run out.</div>`));

  const mfgCount=S.items.filter(i=>i.nature==='manufacturing').length;
  const tradeCount=S.items.filter(i=>i.nature==='trading').length;
  const seg=el(`<div class="seg" id="natSeg">
    <button class="on" data-n="">All (${S.items.length})</button>
    <button data-n="manufacturing">Manufacturing (${mfgCount})</button>
    <button data-n="trading">Trading (${tradeCount})</button>
  </div>`);
  v.appendChild(seg);

  const card=el(`<div class="card"><div class="cb" id="ib"></div></div>`); v.appendChild(card);
  let q='', nat='';
  const render=()=>{
    const ib=card.querySelector('#ib'); ib.innerHTML='';
    const list=S.items.filter(i=> i.name.toLowerCase().includes(q) && (!nat || i.nature===nat));
    if(!list.length){ ib.innerHTML='<div class="empty"><div class="big">📦</div>No products match.</div>'; return; }
    list.forEach(i=>{
      const tot=itemTotal(i.id);
      const low=i.lowStock>0 && tot<=Number(i.lowStock);
      const bits=[esc(i.unit||'unit')];
      if(i.type) bits.push(esc(i.type));
      if(i.hsn) bits.push('HSN '+esc(i.hsn));
      if(i.salesPrice) bits.push('₹'+fmtNum(i.salesPrice));
      const row=el(`<div class="row">
        <div class="grow" style="cursor:pointer">
          <div class="t1">${esc(i.name)} ${naturePill(i.nature)}${low?' <span class="pill low">low</span>':''}</div>
          <div class="t2">${bits.join(' · ')} · ${fmtNum(tot)} in stock</div>
        </div><div class="acts"></div></div>`);
      row.querySelector('.grow').onclick=()=>openProductDetail(i);
      const e=el('<button class="btn ghost sm">Edit</button>');
      const d=el('<button class="btn bad sm" style="margin-left:6px">Delete</button>');
      e.onclick=()=>openItemModal(i); d.onclick=()=>deleteItem(i);
      row.querySelector('.acts').append(e,d);
      ib.appendChild(row);
    });
  };
  render();
  v.querySelector('#prodSearch').addEventListener('input',e=>{q=e.target.value.toLowerCase();render();});
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ nat=b.dataset.n; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
  v.querySelector('#addItem').addEventListener('click',()=>openItemModal());
}

// warehouse detail: stock broken down per area
function openWhDetail(w){
  const areas=whAreas(w.id);
  const sections=areas.map(a=>{
    const rows=S.items.map(i=>{ const q=areaQty(i.id,w.id,a.id); return q>0?`<tr><td>${esc(i.name)}</td><td class="num">${fmtNum(q)} ${esc(i.unit||'')}</td></tr>`:''; }).filter(Boolean).join('');
    const mgr=a.managerEmail?(S.people.find(p=>p.email===a.managerEmail)||{}).name||a.managerEmail:'';
    return `<div class="subsec">${esc(a.name)}${mgr?` <span class="muted" style="text-transform:none;font-weight:600">· manager ${esc(mgr)}</span>`:''}</div>
      ${rows?`<div class="tablewrap"><table><tbody>${rows}</tbody></table></div>`:'<div class="muted" style="font-size:13px">Empty.</div>'}`;
  }).join('');
  modal(w.name+' — stock by area', (w.location?`<div class="t2" style="margin-bottom:8px">${esc(w.location)}</div>`:'')+sections,
    [{label:'Edit areas',cls:'ghost',onClick:()=>openWhModal(w)},{label:'Close',cls:'primary',onClick:closeModal}]);
}

  S.people.forEach(p=>{
    const isMe=p.email===S.me.email;
    const row=el(`<div class="row"><div class="grow">
      <div class="t1">${esc(p.name||p.email)} ${isMe?'<span class="muted">(you)</span>':''} <span class="pill role">${ROLE_LABEL[p.role]||p.role}</span> ${p.active===false?'<span class="pill rejected">archived</span>':''}</div>

    const acts=row.querySelector('.acts');
    const isSuper=p.role==='superadmin', iAmSuper=S.me.role==='superadmin';
    const protectedRow = isSuper && !iAmSuper;   // only a super admin may touch a super admin
    if(protectedRow){
      acts.appendChild(el('<span class="muted" style="font-size:12px">🔒 Protected</span>'));

        const archived=p.active===false;
        const a=el(`<button class="btn ghost sm" style="margin-left:6px">${archived?'Restore':'Archive'}</button>`);
        a.onclick=()=>archivePerson(p,!archived); acts.appendChild(a);
        if(iAmSuper){ const d=el('<button class="btn bad sm" style="margin-left:6px">Delete</button>');

/* ===================================================================== */
function modal(title, bodyHTML, footerBtns){
  closeModal();
  const back=el(`<div class="backdrop"><div class="modal">
    <div class="mh"><h3>${esc(title)}</h3><button class="x">×</button></div>
    <div class="mb">${bodyHTML}</div>
    <div class="mf"></div></div></div>`);
  back.querySelector('.x').onclick=closeModal;
  back.addEventListener('mousedown',e=>{ if(e.target===back) closeModal(); });
  const mf=back.querySelector('.mf');
  (footerBtns||[]).forEach(b=>{ const btn=el(`<button class="btn ${b.cls||'ghost'}">${esc(b.label)}</button>`);
    btn.onclick=()=>b.onClick(btn); mf.appendChild(btn); });
  $('#modalRoot').appendChild(back);
  return back;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function busy(btn,on,label){ btn.disabled=on; if(on){ btn.dataset._t=btn.textContent; btn.innerHTML='<span class="loader"></span>'; }
  else { btn.textContent=label||btn.dataset._t||'Save'; } }

// --- Item modal ---
function openItemModal(item){
  let attrs = Array.isArray(item?.attributes)? JSON.parse(JSON.stringify(item.attributes)) : [];
  let vars  = Array.isArray(item?.variants)?   JSON.parse(JSON.stringify(item.variants))   : [];
  modal(item?'Edit product':'Add product',`
    <div class="fsec">Basics</div>
    <label class="fl">Product name *</label><input id="iName" value="${esc(item?.name||'')}" placeholder="e.g. M8 Bolt">
    <div class="fg2">
      <div><label class="fl">Nature *</label>
        <select id="iNature">
          <option value="">— choose —</option>
          <option value="manufacturing" ${item?.nature==='manufacturing'?'selected':''}>Manufacturing (we make it)</option>
          <option value="trading" ${item?.nature==='trading'?'selected':''}>Trading (we buy &amp; resell)</option>
        </select>
      </div>
      <div><label class="fl">Unit *</label><input id="iUnit" value="${esc(item?.unit||'')}" placeholder="pieces, kg, boxes…"></div>
    </div>
    <label class="fl">Sub-type <span class="hint">optional, e.g. Raw material, Finished, Spare</span></label><input id="iType" value="${esc(item?.type||'')}" placeholder="e.g. Raw material, Finished, Spare">

    <div class="fsec">Pricing &amp; tax <span style="font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0">— all optional</span></div>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label class="fl">Sales price (₹)</label><input id="iSale" type="number" min="0" step="any" value="${item?.salesPrice||''}"></div>
      <div style="flex:1"><label class="fl">Purchase price (₹)</label><input id="iBuy" type="number" min="0" step="any" value="${item?.purchasePrice||''}"></div>
    </div>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label class="fl">Tax %</label><input id="iTax" type="number" min="0" step="any" value="${item?.tax||''}"></div>
      <div style="flex:1"><label class="fl">Sales tax %</label><input id="iStax" type="number" min="0" step="any" value="${item?.salesTax||''}"></div>
      <div style="flex:1"><label class="fl">GST %</label><input id="iGst" type="number" min="0" step="any" value="${item?.gst||''}"></div>
    </div>

    <div class="fsec">Identification <span style="font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0">— optional</span></div>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label class="fl">HSN code</label><input id="iHsn" value="${esc(item?.hsn||'')}"></div>
      <div style="flex:1"><label class="fl">Barcode</label><input id="iBar" value="${esc(item?.barcode||'')}" placeholder="scan/print coming next stage"></div>
    </div>

    <div class="fsec">Stock alert</div>
    <label class="fl">Low-stock minimum <span class="hint">warns you when total falls to this number</span></label>
    <input id="iLow" type="number" min="0" value="${item?.lowStock||''}" placeholder="e.g. 50">
    <label class="fl">Notes</label><textarea id="iNotes" placeholder="optional">${esc(item?.notes||'')}</textarea>

    <div class="subsec">Attributes (optional, can carry a price)</div>
    <div class="chips" id="attrChips"></div>
    <div class="addline"><input id="attrName" placeholder="e.g. Colour: Red"><input id="attrPrice" type="number" step="any" placeholder="₹ ±" style="max-width:80px;flex:0 0 auto"><button type="button" class="btn ghost sm" id="attrAdd">Add</button></div>

    <div class="subsec">Variants (optional, can carry a price)</div>
    <div class="chips" id="varChips"></div>
    <div class="addline"><input id="varName" placeholder="e.g. 10mm"><input id="varPrice" type="number" step="any" placeholder="₹ ±" style="max-width:80px;flex:0 0 auto"><button type="button" class="btn ghost sm" id="varAdd">Add</button></div>

    <div class="field-err" id="iErr"></div>`,
    [{label:'Cancel',onClick:closeModal},
     {label:item?'Save':'Add',cls:'primary',onClick:async(btn)=>{
        const name=$('#iName').value.trim(), unit=$('#iUnit').value.trim();
        const nature=$('#iNature').value;
        if(!name||!unit){ $('#iErr').textContent='Name and unit are required.'; return; }
        if(!nature){ $('#iErr').textContent='Please choose the nature: Manufacturing or Trading.'; return; }
        busy(btn,true);
        const num=id=>{const x=Number($(id).value);return isNaN(x)?0:x;};
        const data={name,unit,nature,type:$('#iType').value.trim(),
          salesPrice:num('#iSale'),purchasePrice:num('#iBuy'),
          tax:num('#iTax'),salesTax:num('#iStax'),gst:num('#iGst'),
          hsn:$('#iHsn').value.trim(),barcode:$('#iBar').value.trim(),
          notes:$('#iNotes').value.trim(),lowStock:num('#iLow'),
          attributes:attrs,variants:vars};
        try{
          if(item){ await db.collection(C.items).doc(item.id).update(data); writeLog('Edited product',name); }
          else { data.createdAt=FieldValue.serverTimestamp(); await db.collection(C.items).add(data); writeLog('Added product',name); }
          closeModal(); toast('Saved','good');
        }catch(e){ busy(btn,false); $('#iErr').textContent='Could not save. '+(e.message||''); }
     }}]);
  function drawChips(){
    const ac=$('#attrChips'), vc=$('#varChips');
    ac.innerHTML = attrs.length? '' : '<span class="muted" style="font-size:13px">None yet.</span>';
    attrs.forEach((a,idx)=>{ const c=el(`<span class="chip">${esc(a.name)}${a.price?` <b>₹${fmtNum(a.price)}</b>`:''} <span class="rm">×</span></span>`);
      c.querySelector('.rm').onclick=()=>{attrs.splice(idx,1);drawChips();}; ac.appendChild(c); });

// core: apply a movement with a transaction so stock never goes wrong
async function doMovement({type,itemId,whId,areaId,toId,toAreaId,qty,note,viaRequest}){
  areaId=areaId||'main'; toAreaId=toAreaId||'main';
  await db.runTransaction(async tx=>{
    if(type==='in'){
      const ref=db.collection(C.stock).doc(stockKey(itemId,whId,areaId));
      const s=await tx.get(ref); const cur=s.exists?Number(s.data().quantity)||0:0;
      tx.set(ref,{itemId,warehouseId:whId,areaId,quantity:cur+qty},{merge:true});
    } else if(type==='out'){
      const ref=db.collection(C.stock).doc(stockKey(itemId,whId,areaId));
      const legRef = areaId==='main'? db.collection(C.stock).doc(legacyKey(itemId,whId)) : null;
      const s=await tx.get(ref); const ls=legRef?await tx.get(legRef):null;
      const cur=(s.exists?Number(s.data().quantity)||0:0)+(ls&&ls.exists?Number(ls.data().quantity)||0:0);
      if(qty>cur) throw new Error(`Only ${fmtNum(cur)} in ${whName(whId)} · ${areaName(whId,areaId)}.`);
      tx.set(ref,{itemId,warehouseId:whId,areaId,quantity:cur-qty},{merge:true});
      if(legRef&&ls&&ls.exists) tx.delete(legRef);
    } else { // transfer (area → area, even across warehouses)
      const fromRef=db.collection(C.stock).doc(stockKey(itemId,whId,areaId));
      const toRef=db.collection(C.stock).doc(stockKey(itemId,toId,toAreaId));
      const legRef = areaId==='main'? db.collection(C.stock).doc(legacyKey(itemId,whId)) : null;
      const fs=await tx.get(fromRef); const ts=await tx.get(toRef); const ls=legRef?await tx.get(legRef):null;
      const fcur=(fs.exists?Number(fs.data().quantity)||0:0)+(ls&&ls.exists?Number(ls.data().quantity)||0:0);
      const tcur=ts.exists?Number(ts.data().quantity)||0:0;
      if(qty>fcur) throw new Error(`Only ${fmtNum(fcur)} in ${whName(whId)} · ${areaName(whId,areaId)}.`);
      tx.set(fromRef,{itemId,warehouseId:whId,areaId,quantity:fcur-qty},{merge:true});
      tx.set(toRef,{itemId,warehouseId:toId,areaId:toAreaId,quantity:tcur+qty},{merge:true});
      if(legRef&&ls&&ls.exists) tx.delete(legRef);
    }
  });
  const mv={type,itemId,quantity:qty,note:note||'',byName:S.me.name,byEmail:S.me.email,
    createdAt:FieldValue.serverTimestamp(), viaRequest:viaRequest||false};
  if(type==='transfer'){ mv.fromWarehouseId=whId; mv.fromAreaId=areaId; mv.toWarehouseId=toId; mv.toAreaId=toAreaId; }
  else { mv.warehouseId=whId; mv.areaId=areaId; }
  await db.collection(C.movements).add(mv);
  writeLog('Stock '+type.toUpperCase(), `${fmtNum(qty)} ${itemUnit(itemId)} ${itemName(itemId)}`);
  notifyAreaManagers({type,itemId,whId,areaId,toId,toAreaId,qty});
}
// notify the manager(s) of the area(s) involved in a movement
function notifyAreaManagers({type,itemId,whId,areaId,toId,toAreaId,qty}){
  const tell=(em,msg)=>{ if(!em) return; const p=S.people.find(x=>x.email===em); if(p&&p.whatsapp&&p.active!==false) sendWhatsApp(p.whatsapp,msg); };
  const what=`${fmtNum(qty)} ${itemUnit(itemId)} ${itemName(itemId)}`;
  if(type==='in')  tell(areaManager(whId,areaId), `Stock IN: ${what} into ${whName(whId)} · ${areaName(whId,areaId)}.`);
  if(type==='out') tell(areaManager(whId,areaId), `Stock OUT: ${what} from ${whName(whId)} · ${areaName(whId,areaId)}.`);
  if(type==='transfer'){
    tell(areaManager(whId,areaId), `Transfer OUT: ${what} → ${whName(toId)} · ${areaName(toId,toAreaId)}.`);
    tell(areaManager(toId,toAreaId), `Transfer IN: ${what} from ${whName(whId)} · ${areaName(whId,areaId)}.`);
  }
}

async function decideRequest(r,approve){
  if(!approve){
    confirmModal('Reject request?',`Reject this request from ${esc(r.requestedByName)}?`,async(btn)=>{
      busy(btn,true);
      try{
        await db.collection(C.requests).doc(r.id).update({status:'rejected',
          decidedByName:S.me.name,decidedByEmail:S.me.email,decidedAt:FieldValue.serverTimestamp()});
        writeLog('Rejected request', `${itemName(r.itemId)} for ${r.requestedByName}`);
        const reqP=S.people.find(p=>p.email===r.requestedByEmail);
        if(reqP?.whatsapp) sendWhatsApp(reqP.whatsapp,`Your stock request (${itemName(r.itemId)}) was rejected by ${S.me.name}.`);
        closeModal(); toast('Rejected');
      }catch(e){ busy(btn,false); toast('Failed','bad'); }
    },'Reject','bad');
    return;
  }
  // approve = perform the movement, then mark approved
  confirmModal('Approve request?',
    `Approve and ${r.type==='in'?'add':'remove'} ${fmtNum(r.quantity)} ${esc(itemUnit(r.itemId))} of ${esc(itemName(r.itemId))} ${r.type==='in'?'to':'from'} ${esc(whName(r.warehouseId))}?`,
    async(btn)=>{
      busy(btn,true);
      try{
        await doMovement({type:r.type,itemId:r.itemId,whId:r.warehouseId,qty:r.quantity,
          note:`Request by ${r.requestedByName}`,viaRequest:true});
        await db.collection(C.requests).doc(r.id).update({status:'approved',
          decidedByName:S.me.name,decidedByEmail:S.me.email,decidedAt:FieldValue.serverTimestamp()});
        writeLog('Approved request', `${itemName(r.itemId)} for ${r.requestedByName}`);

function maxBuildable(m){
  const bom=(m.bom||[]).filter(x=>x.itemId&&Number(x.qty)>0);
  if(!bom.length) return 0;
  return Math.floor(Math.min(...bom.map(x=>itemTotal(x.itemId)/(Number(x.qty)||1))));
}

  v.innerHTML='';

  const card=el(`<div class="card"><div class="cb" id="mb"></div></div>`); v.appendChild(card);

function buildStepperHTML(b){
  const rejected=b.status==='rejected';
  const order=['requested','pending_approval','approved','issued','completed'];
  const cur = rejected? 2 : order.indexOf(b.status);
  const steps=[
    {t:'Requested', m:`by ${esc(b.requestedByName||'?')} · ${fmtDate(b.createdAt)}`},
    {t:'Reviewed & sent for approval', m:b.reviewedByName?`by ${esc(b.reviewedByName)} · ${fmtDate(b.reviewedAt)}`:'Warehouse manager reviews the request'},
    {t: rejected?'Rejected by manager':'Manager approval', m: rejected?`by ${esc(b.decidedByName||'')}`:(b.decidedByName?`Approved by ${esc(b.decidedByName)} · ${fmtDate(b.decidedAt)}`:'Manager approves the build')},
    {t:'Material issued', m:b.issuedByName?`by ${esc(b.issuedByName)} · ${fmtDate(b.issuedAt)}${b.shortages?' · ⚠ shortages':''}`:'Warehouse manager issues parts; stock reduces'},
    {t:'Serial numbers & ready', m:b.completedByName?`Accountant notified · ${esc(b.completedByName)} · ${fmtDate(b.completedAt)}`:(b.serials?'Serials added — mark ready to notify accountant':'Requester adds serials, then mark ready')},
  ];
  return '<div class="stepper">'+steps.map((s,i)=>{
    let cls;
    if(b.status==='completed') cls='done';
    else if(rejected) cls = i<2?'done':(i===2?'current':'pending');
    else cls = i<cur?'done':(i===cur?'current':'pending');
    const dot = cls==='done'?'✓':(i+1);
    return `<div class="step ${cls}"><div class="dot">${dot}</div><div style="flex:1"><div class="stt">${s.t}</div><div class="smeta">${s.m}</div></div></div>`;
  }).join('')+'</div>';
}

// Deduct {itemId,need}[] from a warehouse, pulling across its areas (Main first). Reads-before-writes safe.
async function consumeItemsTx(tx, items, whId){
  const areas=whAreas(whId).map(a=>a.id);
  const plans=items.map(it=>({ itemId:it.itemId, need:it.need,
    slots:areas.map(aid=>({aid,ref:db.collection(C.stock).doc(stockKey(it.itemId,whId,aid))})),
    legRef:db.collection(C.stock).doc(legacyKey(it.itemId,whId)) }));
  for(const p of plans){
    for(const s of p.slots){ const snap=await tx.get(s.ref); s.qty=snap.exists?Number(snap.data().quantity)||0:0; }
    const lsnap=await tx.get(p.legRef); p.legQty=lsnap.exists?Number(lsnap.data().quantity)||0:0;
  }
  const result=[];
  for(const p of plans){
    if(p.legQty>0){ let m=p.slots.find(s=>s.aid==='main'); if(!m){ m={aid:'main',ref:db.collection(C.stock).doc(stockKey(p.itemId,whId,'main')),qty:0}; p.slots.unshift(m); } m.qty+=p.legQty; }
    p.slots.sort((a,b)=> a.aid==='main'?-1 : b.aid==='main'?1 : 0);
    let remaining=p.need;
    for(const s of p.slots){ if(remaining<=0) break; const take=Math.min(s.qty,remaining); if(take>0){ tx.set(s.ref,{itemId:p.itemId,warehouseId:whId,areaId:s.aid,quantity:s.qty-take},{merge:true}); remaining-=take; } }
    if(p.legQty>0) tx.delete(p.legRef);
    result.push({itemId:p.itemId, need:p.need, issued:p.need-remaining, short:Math.max(0,remaining)});
  }
  return result;
}
async function issueBuild(b){
  const needs=(b.bom||[]).map(x=>({itemId:x.itemId, need:(Number(x.qty)||0)*(Number(b.qty)||1)})).filter(n=>n.need>0);
  if(!needs.length) throw new Error('This machine has no parts list.');
  let result=[];
  await db.runTransaction(async tx=>{ result=await consumeItemsTx(tx,needs,b.warehouseId); });
  for(const r of result){ if(r.issued>0){ await db.collection(C.movements).add({type:'out',itemId:r.itemId,warehouseId:b.warehouseId,quantity:r.issued,note:'Build: '+b.machineName,byName:S.me.name,byEmail:S.me.email,viaBuild:b.id,createdAt:FieldValue.serverTimestamp()}); } }
  const shortages=result.some(r=>r.short>0);
  const clean=result.map(r=>({itemId:r.itemId,need:r.need,issued:r.issued,short:r.short}));
  await db.collection(C.builds).doc(b.id).update({status:'issued',issued:clean,shortages,issuedByName:S.me.name,issuedAt:FieldValue.serverTimestamp()});
  writeLog('Issued material for build',b.machineName+(shortages?' (with shortages)':''));
  const reqP=S.people.find(p=>p.email===b.requestedByEmail); if(reqP&&reqP.whatsapp) sendWhatsApp(reqP.whatsapp,`Material for "${b.machineName}" is issued. Please collect it.`);
  if(shortages){ writeLog('Purchase alert: shortage on build',b.machineName);
    S.people.filter(p=>RANK[p.role]>=RANK.admin&&p.whatsapp).forEach(p=>sendWhatsApp(p.whatsapp,`Stock short while issuing build "${b.machineName}". Purchase needed.`)); }
}

function customerName(id){ const c=S.customers.find(x=>x.id===id); return c?c.name:'(deleted customer)'; }
// stock reserved by allocations that are still open (status 'reserved')
function reservedQty(itemId,whId){ let r=0;
  S.allocations.forEach(a=>{ if(a.status==='reserved' && a.warehouseId===whId)
    (a.lines||[]).forEach(l=>{ if(l.itemId===itemId) r+=Number(l.qty)||0; }); });
  return r; }
function availableQty(itemId,whId){ return Math.max(0, stockQty(itemId,whId)-reservedQty(itemId,whId)); }
function allocRecipient(a){
  if(a.recipientType==='customer') return a.customerName||'(customer)';
  if(a.recipientType==='person')   return a.personName||'(staff)';
  return a.recipientName||'Walk-in';
}
function allocRecipientKind(a){
  return a.recipientType==='customer'?'Customer':a.recipientType==='person'?'Staff':'Walk-in';
}
function allocStatusPill(a){
  if(a.status==='delivered') return `<span class="pill completed">Delivered${a.shortages?' (short)':''}</span>`;
  if(a.status==='cancelled') return '<span class="pill role">Cancelled</span>';
  return '<span class="pill pending">Reserved</span>';
}

    box.querySelectorAll('.x').forEach(b=>b.onclick=e=>{ if(lines.length>1){ lines.splice(+e.target.dataset.i,1); drawLines(); } });
  };
  drawLines();
  $('#aWh').onchange=drawLines;
  $('#aAddLine').onclick=()=>{ lines.push({itemId:S.items[0].id,qty:1}); drawLines(); };

  async function saveAlloc(btn){
    const type=$('#aType').value, wh=$('#aWh').value, mode=$('#aMode').value;

    }

        createdByName:S.me.name,createdByEmail:S.me.email,createdAt:FieldValue.serverTimestamp()});
      writeLog('Created allocation',allocRecipient({...data})+` · ${clean.length} item(s)`);
      if(mode==='deliver'){ await deliverAllocation({id:ref.id,...data,status:'reserved'}); }
      closeModal(); toast(mode==='deliver'?'Delivered':'Reserved','good');
    }catch(e){ busy(btn,false); $('#aErr').textContent='Could not save. '+(e.message||''); }
  }
}

async function deliverAllocation(a){
  const needs=(a.lines||[]).map(l=>({itemId:l.itemId,need:Number(l.qty)||0})).filter(n=>n.need>0);
  if(!needs.length) throw new Error('No products in this allocation.');
  let result=[];
  await db.runTransaction(async tx=>{ result=await consumeItemsTx(tx,needs,a.warehouseId); });
  for(const r of result){ if(r.issued>0){ await db.collection(C.movements).add({type:'out',itemId:r.itemId,warehouseId:a.warehouseId,quantity:r.issued,note:'Allocation: '+allocRecipient(a),byName:S.me.name,byEmail:S.me.email,viaAllocation:a.id,createdAt:FieldValue.serverTimestamp()}); } }
  const shortages=result.some(r=>r.short>0);
  const clean=result.map(r=>({itemId:r.itemId,qty:r.need,issued:r.issued,short:r.short}));
  await db.collection(C.allocations).doc(a.id).update({status:'delivered',delivered:clean,shortages,
    deliveredByName:S.me.name,deliveredByEmail:S.me.email,deliveredAt:FieldValue.serverTimestamp()});
  writeLog('Delivered allocation',allocRecipient(a)+(shortages?' (with shortages)':''));
  if(a.recipientType==='customer'){ const c=S.customers.find(x=>x.id===a.customerId); if(c&&c.phone) sendWhatsApp(c.phone,`Dispatched to ${c.name}: ${clean.length} item(s) from ${companyName()}.`); }
  if(shortages){ writeLog('Purchase alert: shortage on delivery',allocRecipient(a));
    S.people.filter(p=>RANK[p.role]>=RANK.admin&&p.whatsapp).forEach(p=>sendWhatsApp(p.whatsapp,`Stock short while delivering to ${allocRecipient(a)}. Purchase needed.`)); }
}

  confirmModal('Cancel allocation?',`Cancel the reserved allocation for "${esc(allocRecipient(a))}"? The reserved stock will be released.`,async(btn)=>{ busy(btn,true);
    try{ await db.collection(C.allocations).doc(a.id).update({status:'cancelled',cancelledByName:S.me.name,cancelledAt:FieldValue.serverTimestamp()});
      writeLog('Cancelled allocation',allocRecipient(a)); closeModal(); toast('Cancelled'); }
    catch(e){ busy(btn,false); toast('Failed','bad'); }
  },'Cancel allocation','bad');
}
function printDeliveryNote(a){
  const rows=(a.lines||[]).map(l=>{ const giv=a.delivered?(a.delivered.find(z=>z.itemId===l.itemId)||{}).issued??l.qty:l.qty;
    return `<tr><td>${esc(itemName(l.itemId))}</td><td style="text-align:right">${fmtNum(giv)} ${esc(itemUnit(l.itemId))}</td></tr>`; }).join('');
  const html=`<html><head><title>Delivery Note</title><style>
    body{font-family:Arial,sans-serif;color:#1b2230;padding:30px;max-width:680px;margin:auto}
    h1{font-size:20px;margin:0} .sub{color:#666;font-size:13px;margin:2px 0 18px}
    table{width:100%;border-collapse:collapse;margin-top:12px} th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left;font-size:14px}
    th{background:#f4f5f7} .meta{font-size:13px;line-height:1.7;margin-top:6px} .foot{margin-top:40px;font-size:12px;color:#888}
  </style></head><body>
    <h1>${esc(companyName())}</h1><div class="sub">Delivery / Allocation Note</div>
    <div class="meta"><b>To:</b> ${esc(allocRecipient(a))} (${allocRecipientKind(a)})<br>
    <b>From warehouse:</b> ${esc(whName(a.warehouseId))}<br>
    <b>Date:</b> ${fmtDate(a.deliveredAt||a.createdAt)}<br>
    ${a.note?`<b>Note:</b> ${esc(a.note)}<br>`:''}</div>
    <table><thead><tr><th>Product</th><th style="text-align:right">Quantity</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="foot">Issued by ${esc(a.deliveredByName||a.createdByName||'')} · Generated from Kasera Stock</div>
  </body></html>`;
  const w=window.open('','_blank');
  if(!w){ toast('Allow pop-ups to print','bad'); return; }
  w.document.write(html); w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
}

/* ===================================================================== */
/*  9)  SUPER-ADMIN SETTINGS  (WhatsApp / 11za, company)                 */
/* ===================================================================== */
function companyName(){ return (S.config&&S.config.companyName)||'Kasera Industries'; }
async function saveConfig(patch){ await db.collection(C.config).doc('settings').set(patch,{merge:true}); }
function viewSettings(v){
  v.innerHTML='';
  if(!can.settings()){ v.appendChild(el('<div class="card"><div class="empty">Settings are for the super admin only.</div></div>')); return; }
  v.appendChild(el(`<div class="viewhead"><h2>Settings</h2>
    <div class="sub">Super-admin controls for the whole portal.</div></div>`));

  const cfg=S.config||{};
  const waOn = !!cfg.whatsappEnabled && !!cfg.whatsappUrl;

  // ---- Company ----
  const comp=el(`<div class="card">
    <div class="ch">Company</div>
    <div class="cb" style="padding:14px 16px">
      <label class="fl" style="margin-top:0">Company name <span class="hint">shown on delivery notes</span></label>
      <input id="setCompany" value="${esc(cfg.companyName||'Kasera Industries')}">
      <button class="btn primary" id="setCompanySave" style="margin-top:12px">Save</button>
    </div></div>`);
  v.appendChild(comp);
  comp.querySelector('#setCompanySave').onclick=async(e)=>{ const btn=e.target; busy(btn,true);
    try{ await saveConfig({companyName:$('#setCompany').value.trim()||'Kasera Industries'}); toast('Saved','good'); }
    catch(err){ toast('Could not save — check permissions','bad'); } busy(btn,false); };

  // ---- WhatsApp / 11za ----
  const KNOWN_WA_URL='https://script.google.com/macros/s/AKfycbwK4wukGnGPnYsJikJnkRkgWfr2YOpd-wQfZS68sSdrQk4skcRGsFGO2ZpPxO4BGTzd/exec';
  const wa=el(`<div class="card">
    <div class="ch">WhatsApp notifications (11za)
      <span class="pill ${waOn?'completed':'role'}" style="margin-left:auto">${waOn?'Connected ✓':'Off'}</span></div>
    <div class="cb" style="padding:14px 16px">
      <div class="guide" style="margin-top:0">This sends through the <b>same Apps Script + 11za</b> as your Task app. 11za needs an <b>approved template</b>. The simplest is a one-line template whose body is just <code>{{1}}</code> — the full alert text goes into it. Create that template in 11za, then put its <b>exact name</b> below.</div>
      <label class="fl">Apps Script Service URL <span class="hint">same /exec URL as the Task app's Technical setting</span></label>
      <input id="setWaUrl" value="${esc(cfg.whatsappUrl||KNOWN_WA_URL)}" placeholder="https://script.google.com/macros/s/…/exec">
      <label class="fl">11za template name <span class="hint">e.g. stock_alert (body: {{1}})</span></label>
      <input id="setWaTpl" value="${esc(cfg.whatsappTemplate||'')}" placeholder="approved template name">
      <label class="fl" style="display:flex;align-items:center;gap:8px;margin-top:14px">
        <input type="checkbox" id="setWaOn" ${cfg.whatsappEnabled?'checked':''} style="width:auto"> Send WhatsApp notifications</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <button class="btn primary" id="setWaSave">Save</button>
        <button class="btn good" id="setWaTest">Save &amp; send me a test</button>
      </div>
      <div class="t2" id="setWaMsg" style="margin-top:10px"></div>
    </div></div>`);
  v.appendChild(wa);
  const saveWa=async()=>{ await saveConfig({whatsappUrl:$('#setWaUrl').value.trim(), whatsappTemplate:$('#setWaTpl').value.trim(), whatsappEnabled:$('#setWaOn').checked}); };
  wa.querySelector('#setWaSave').onclick=async(e)=>{ const btn=e.target; busy(btn,true);
    try{ await saveWa(); toast('Saved','good'); $('#setWaMsg').textContent='Saved.'; }
    catch(err){ toast('Could not save — check permissions','bad'); } busy(btn,false); };
  wa.querySelector('#setWaTest').onclick=async(e)=>{ const btn=e.target; busy(btn,true);
    try{ await saveWa();
      const myNum=(S.people.find(p=>p.email===S.me.email)||{}).whatsapp;
      if(!myNum){ $('#setWaMsg').innerHTML='Saved. <b>Add a WhatsApp number to your own profile in People</b> to receive a test.'; busy(btn,false); return; }
      if(!$('#setWaOn').checked){ $('#setWaMsg').textContent='Saved. Tick "Send WhatsApp notifications" first, then test.'; busy(btn,false); return; }
      if(!$('#setWaTpl').value.trim()){ $('#setWaMsg').textContent='Enter your approved 11za template name first.'; busy(btn,false); return; }
      await sendWhatsApp(myNum, `Test from ${companyName()} Stock — 11za is connected.`);
      $('#setWaMsg').innerHTML='Test sent to <b>'+esc(myNum)+'</b>. If it does not arrive, check the template name is approved in 11za.'; }
    catch(err){ $('#setWaMsg').textContent='Could not send. Check the URL and template.'; } busy(btn,false); };

  // ---- What gets notified ----
  v.appendChild(el(`<div class="card">
    <div class="ch">What sends a WhatsApp</div>
    <div class="cb" style="padding:6px 16px 14px">
      <ul class="t2" style="margin:8px 0 0;padding-left:18px;line-height:1.9">
        <li>New build request → supervisors &amp; admins</li>
        <li>Build approved / material issued → the requester</li>
        <li>Stock moved in/out of an area → that area's manager</li>
        <li>Allocation delivered → the customer (if they have a number)</li>
        <li>Stock shortage on a build or delivery → admins (purchase alert)</li>
      </ul>
    </div></div>`));

  // ---- Access panel ----
  const roles=[['employee','Employee'],['supervisor','Supervisor'],['admin','Admin']];
  const acc=cfg.access||{};
  const accCard=el(`<div class="card">
    <div class="ch">Access — what each role can see</div>
    <div class="cb" style="padding:14px 16px">
      <div class="guide" style="margin-top:0">Tick the sections each role may open. Super Admin always sees everything. Admin-only areas (Products, Machines, Warehouses, People, Settings) stay restricted by role and aren't listed here.</div>
      <div class="tablewrap"><table><thead><tr><th>Section</th>${roles.map(r=>`<th class="num">${r[1]}</th>`).join('')}</tr></thead>
      <tbody>${ACCESS_SECTIONS.map(s=>`<tr><td>${s.label}</td>${roles.map(r=>{
        const on = !(acc[r[0]] && acc[r[0]][s.k]===false);
        return `<td class="num"><input type="checkbox" data-role="${r[0]}" data-sec="${s.k}" ${on?'checked':''} style="width:auto"></td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>
      <button class="btn primary" id="accSave" style="margin-top:14px">Save access</button>
      <div class="t2" id="accMsg" style="margin-top:8px"></div>
    </div></div>`);
  v.appendChild(accCard);
  accCard.querySelector('#accSave').onclick=async(e)=>{ const btn=e.target; busy(btn,true);
    const next={};
    accCard.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      const r=cb.dataset.role, s=cb.dataset.sec; next[r]=next[r]||{}; next[r][s]=cb.checked; });
    try{ await saveConfig({access:next}); toast('Access saved','good'); $('#accMsg').textContent='Saved. The sidebar updates for each role immediately.'; }
    catch(err){ toast('Could not save — check permissions','bad'); } busy(btn,false); };

  // ---- Coming next ----
  v.appendChild(el(`<div class="card">
    <div class="ch">Coming in the next phases</div>
    <div class="cb" style="padding:6px 16px 14px">
      <ul class="t2" style="margin:8px 0 0;padding-left:18px;line-height:1.9">
        <li>Editable form fields — turn fields on/off and required/optional</li>
        <li>Language switch (English / Hindi)</li>
      </ul>
    </div></div>`));
}

async function doBackup(){
  toast('Preparing backup…');
  try{
    const out={ exportedAt:new Date().toISOString(), exportedBy:S.me.email };
    for(const [name,coll] of Object.entries(C)){
      const snap=await db.collection(coll).get();
      out[name]=snap.docs.map(d=>({id:d.id,...d.data()}));
    }
    const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`kasera-stock-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    writeLog('Downloaded backup','full export');
    toast('Backup downloaded','good');
  }catch(e){ console.error(e); toast('Backup failed','bad'); }
}
